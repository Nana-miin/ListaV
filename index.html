<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Mis 27! - Control de Bebidas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --rosa-fuerte: #ff4d85;
            --rosa-claro: #ff85a8;
            --texto-oscuro: #333333;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            max-width: 100vw; 
            min-height: 100vh;
            margin: 0; 
            padding: 1rem; 
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--texto-oscuro);
            background-color: #ffffff;
            background-image: url('fondo.jpeg');
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: contain; 
        }

        .container { width: 100%; max-width: 450px; margin-top: 2rem; }

        .card { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 2rem; 
            margin-bottom: 1.5rem; 
            border-radius: 20px; 
            box-shadow: 0 8px 32px rgba(255, 77, 133, 0.15); 
            text-align: center;
        }

        h2, h3 { color: var(--rosa-fuerte); margin-top: 0; font-weight: 800; }
        p { font-size: 0.95rem; margin-bottom: 1.5rem; }

        input, select { 
            width: 100%; 
            margin-bottom: 1.2rem; 
            padding: 0.8rem; 
            font-size: 1rem; 
            font-family: 'Poppins', sans-serif;
            border: 2px solid #fee1e8; 
            border-radius: 12px; 
            box-sizing: border-box; 
            background-color: rgba(255,255,255,0.9);
            transition: border-color 0.3s;
        }

        input:focus, select:focus { outline: none; border-color: var(--rosa-fuerte); }
        label { display: block; text-align: left; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.3rem; color: #555; }

        /* ESTILOS DEL NUEVO CONTADOR */
        .contador {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 1.2rem;
        }
        
        .contador input {
            width: 60px;
            margin-bottom: 0;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--rosa-fuerte);
            padding: 0.5rem;
            background: transparent;
            border: none;
        }

        /* Ocultar las flechitas por defecto del input number */
        .contador input[type="number"]::-webkit-inner-spin-button, 
        .contador input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        .contador input[type="number"] { -moz-appearance: textfield; }

        .btn-circulo {
            width: 45px;
            height: 45px;
            padding: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--rosa-fuerte);
            border: 2px solid var(--rosa-fuerte);
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
            transition: all 0.2s;
        }

        .btn-circulo:hover {
            background: var(--rosa-fuerte);
            color: white;
            transform: scale(1.1);
        }

        button { 
            width: 100%;
            background: linear-gradient(135deg, var(--rosa-claro) 0%, var(--rosa-fuerte) 100%);
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            padding: 1rem;
            border-radius: 30px;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(255, 77, 133, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Poppins', sans-serif;
        }

        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 77, 133, 0.4); }

        .btn-rojo { 
            background: linear-gradient(135deg, #757575 0%, #424242 100%); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-size: 0.9rem;
            padding: 0.6rem 1.2rem;
            width: auto;
        }
        .btn-rojo:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.3); }

        .hidden { display: none; }

        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 1rem; font-size: 0.9rem; border-radius: 10px; overflow: hidden; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #fee1e8; }
        th { background-color: var(--rosa-fuerte); color: white; font-weight: 600; }
        tr:last-child td { border-bottom: none; }
        .total-row { background-color: #fff0f4; font-weight: bold; color: var(--rosa-fuerte); }
    </style>
</head>
<body>

    <div class="container">
        <!-- PANTALLA DE INGRESO -->
        <div id="loginSection" class="card">
            <h2>✨ ¡Mis 27! ✨</h2>
            <p>Seleccioná tu nombre para arrancar la noche.</p>
            
            <select id="nombreUsuario" required>
                <option value="">¿Quién sos?...</option>
                <option value="Victoria">Victoria (Admin)</option>
                <option value="Jimena">Jimena</option>
                <option value="Matias">Matias</option>
                <option value="Lucas">Lucas</option>
                <option value="Sofia">Sofia</option>
            </select>

            <button onclick="iniciarSesion()">Entrar a la fiesta</button>
        </div>

        <!-- PANTALLA PRINCIPAL (Oculta al inicio) -->
        <div id="mainSection" class="hidden">
            
            <div class="card" style="display: flex; justify-content: space-between; align-items: center; padding: 1.5rem;">
                <h3 id="saludo" style="margin: 0; font-size: 1.2rem;"></h3>
                <button onclick="cerrarSesion()" class="btn-rojo">Salir</button>
            </div>

            <!-- FORMULARIO PARA ANOTAR -->
            <div class="card">
                <h3>🍹 ¿Qué vas a tomar?</h3>
                <form id="drinkForm">
                    <label>Bebida:</label>
                    <select id="bebida" required>
                        <option value="">Elegí una opción...</option>
                        <option value="Cerveza">Cerveza</option>
                        <option value="Fernet">Fernet</option>
                        <option value="Gin Tonic">Gin Tonic</option>
                        <option value="Vino">Vino</option>
                        <option value="Vodka">Vodka</option>
                        <option value="Agua/Gaseosa">Agua / Gaseosa</option>
                    </select>

                    <label style="text-align: center;">Cantidad</label>
                    <!-- ACÁ ESTÁ EL NUEVO CONTADOR -->
                    <div class="contador">
                        <button type="button" class="btn-circulo" onclick="modificarCantidad(-1)">-</button>
                        <input type="number" id="cantidad" value="1" min="1" readonly>
                        <button type="button" class="btn-circulo" onclick="modificarCantidad(1)">+</button>
                    </div>

                    <button type="submit">¡Salud! 🥂</button>
                </form>
                <p id="mensaje" style="color: var(--rosa-fuerte); font-weight: bold; margin-top: 15px; margin-bottom: 0;"></p>
            </div>

            <!-- LISTA DE CONSUMOS -->
            <div class="card">
                <h3 id="tituloLista">Tus Consumos</h3>
                <div id="listaConsumos" style="margin-bottom: 15px;">Cargando...</div>
                <button onclick="cargarConsumos()" style="font-size: 0.9rem; padding: 0.8rem;">Actualizar Lista</button>
            </div>
        </div>
    </div>

    <script>
        // PEGAR AQUÍ TU URL DE APPS SCRIPT (Asegurate de que termine en /exec)
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbymAaUiXJnkKL8IzRQIvHp1FtU4uhHWr-iefe6MFXsWTxrGrW3dsAlJ5haXsVHU8Oc/exec'; 
        let usuarioActual = "";

        function iniciarSesion() {
            const select = document.getElementById('nombreUsuario');
            const nombreElegido = select.options[select.selectedIndex].value;
            
            if (!nombreElegido) {
                alert("Por favor, seleccioná quién sos.");
                return;
            }
            
            usuarioActual = nombreElegido; 
            
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('mainSection').classList.remove('hidden');
            document.getElementById('saludo').innerText = "Hola, " + usuarioActual;
            
            if (usuarioActual.toLowerCase() === "victoria") {
                document.getElementById('tituloLista').innerText = "👑 Modo Admin";
            } else {
                document.getElementById('tituloLista').innerText = "Tu Historial";
            }

            cargarConsumos();
        }

        function cerrarSesion() {
            usuarioActual = "";
            document.getElementById('nombreUsuario').value = "";
            document.getElementById('mainSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        }

        // FUNCIÓN PARA EL BOTÓN + Y -
        function modificarCantidad(cambio) {
            const input = document.getElementById('cantidad');
            let nuevoValor = parseInt(input.value) + cambio;
            // Evitamos que baje a 0 o números negativos
            if (nuevoValor >= 1) {
                input.value = nuevoValor;
            }
        }

        // GUARDAR UN NUEVO DATO
        document.getElementById('drinkForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            btn.innerText = "Anotando...";
            btn.style.opacity = "0.7";

            const data = {
                action: 'add',
                nombre: usuarioActual,
                bebida: document.getElementById('bebida').value,
                cantidad: document.getElementById('cantidad').value
            };

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => {
                document.getElementById('mensaje').innerText = "¡Anotado con éxito!";
                document.getElementById('bebida').value = "";
                document.getElementById('cantidad').value = "1"; // Reseteamos a 1
                cargarConsumos(); 
                
                btn.innerText = "¡Salud! 🥂";
                btn.style.opacity = "1";
                setTimeout(() => document.getElementById('mensaje').innerText = "", 3000);
            }).catch(err => {
                document.getElementById('mensaje').innerText = "Error al anotar.";
                btn.innerText = "¡Salud! 🥂";
                btn.style.opacity = "1";
            });
        });

        // BORRAR UN DATO
        function borrarConsumo(rowIndex) {
            if(!confirm("¿Seguro que querés borrar esta bebida?")) return;
            
            const lista = document.getElementById('listaConsumos');
            lista.innerHTML = "<p style='color: #888;'>Borrando...</p>";

            const data = {
                action: 'delete',
                rowIndex: rowIndex
            };

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => {
                cargarConsumos();
            }).catch(err => {
                alert("Error al borrar.");
                cargarConsumos();
            });
        }

        // LEER LOS DATOS (EL HISTORIAL)
        function cargarConsumos() {
            const lista = document.getElementById('listaConsumos');
            lista.innerHTML = "<p style='color: #888;'>Cargando datos...</p>";
            
            fetch(APPS_SCRIPT_URL, {
                method: 'GET',
                redirect: 'follow'
            })
            .then(response => {
                if (!response.ok) throw new Error('Error en red');
                return response.json();
            })
            .then(data => {
                let html = "<table><tr><th>Invitado</th><th>Bebida</th><th>Cant.</th><th></th></tr>";
                let totalBebidas = 0;
                let hayDatos = false;

                data.forEach(fila => {
                    if (usuarioActual.toLowerCase() === "victoria" || fila.nombre.toLowerCase() === usuarioActual.toLowerCase()) {
                        html += `<tr>
                                    <td>${fila.nombre}</td>
                                    <td>${fila.bebida}</td>
                                    <td style="text-align: center;">${fila.cantidad}</td>
                                    <td style="text-align: center;">
                                        <button type="button" onclick="borrarConsumo(${fila.rowIndex})" style="background: none; border: none; color: red; box-shadow: none; padding: 0; width: auto; font-size: 1.2rem; cursor: pointer;">❌</button>
                                    </td>
                                 </tr>`;
                        totalBebidas += Number(fila.cantidad);
                        hayDatos = true;
                    }
                });

                html += `<tr class="total-row"><td colspan="2">Total acumulado</td><td colspan="2" style="text-align: center;">${totalBebidas}</td></tr>`;
                html += "</table>";

                if (!hayDatos) {
                    lista.innerHTML = "<p style='color: #888;'>Todavía no hay nada anotado.</p>";
                } else {
                    lista.innerHTML = html;
                }
            })
            .catch(err => {
                console.error("Error:", err);
                lista.innerHTML = "<p style='color: red;'>Error al cargar. Verificá la URL de Apps Script.</p>";
            });
        }
    </script>
</body>
</html>
